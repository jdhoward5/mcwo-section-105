name: Check lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s demos -p 'test_*.py'
      - run: python -m compileall -q demos scripts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the packaged lab
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check packaged notes, assets, and APIs
        run: python3 scripts/check_lab.py
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the lab
        if: always()
        run: docker compose down
